name: Bug report / 问题反馈
description: Report a reproducible problem without personal room data.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include browser, OS and version. Use synthetic plans only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior / 预期与实际结果
    validations:
      required: true
